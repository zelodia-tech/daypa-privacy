<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed | Day-P.A</title>
<style>
  :root { --violet:#7A14BE; --bg:#F7ECFC; --text:#3B1A5A; --muted:#6F5A82; --card:#FFFFFF; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:'Nunito','Segoe UI',Arial,sans-serif; padding:24px; }
  .card { background:var(--card); border-radius:28px; padding:36px 28px; max-width:420px; width:100%;
          text-align:center; box-shadow:0 10px 30px rgba(122,20,190,.12); }
  .tick { width:72px; height:72px; border-radius:50%; background:var(--violet); color:#fff; font-size:40px;
          display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-weight:800; }
  h1 { margin:0 0 10px; font-size:28px; font-weight:900; }
  p { margin:0 0 14px; font-size:17px; line-height:1.5; color:var(--muted); }
  .brand { margin-top:22px; font-weight:900; color:var(--violet); font-size:20px; }
  .small { font-size:14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="tick" aria-hidden="true">&#10003;</div>
    <h1>Email confirmed</h1>
    <p>Thank you! Your email address is confirmed.</p>
    <p><strong>Now go back to the Day-P.A app on your phone. It will sign you in automatically.</strong></p>
    <p class="small">You can close this page.</p>
    <div class="brand">Day-P.A</div>
  </main>
</body>
</html>
